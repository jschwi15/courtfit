<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CourtFit</title>
<meta name="description" content="Workout tracker: log sets, routines and progress.">
<meta name="theme-color" content="#fff4f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CourtFit">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="icon" href="logo-64.png" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* CourtFit look: pastel and girly. Blush background, cotton-candy pink, lilac and peach,
   with deep plum text so everything stays easy to read.
   Layout: one working column, sticky header, frosted bottom tab bar. */
:root {
  --bg: #fff4f8;
  --surface: #ffffff;
  --raised: #fdeef5;
  --line: rgba(214, 120, 165, .2);
  --ink: #4a2238;
  --muted: #8a6177;
  --pink: #c8508a;          /* rose text/icons on light backgrounds */
  --pink-2: #f4a6c8;
  --pastel: #f8b6d2;        /* cotton-candy pink fills */
  --plum: #9a6bd1;          /* lilac text */
  --lilac: #dcc6f6;         /* lilac fills */
  --peach: #ffcdb8;
  --on-accent: #4a1736;
  --grad: linear-gradient(135deg, #f9b3d1 0%, #e5c8f7 100%);
  --good: #2e8a58;
  --warn: #f6c56f;
  --warn-ink: #9a5b00;
  --bad: #d4475e;
  --chip: rgba(240, 150, 190, .14);
  --glass: rgba(255, 246, 250, .84);
  --shadow: 0 10px 26px rgba(200, 80, 138, .14);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
  --tabbar-h: 68px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 340px; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, rgba(249, 179, 209, .55) 0%, rgba(229, 200, 247, .35) 50%, rgba(255, 244, 248, 0) 100%); }
[hidden] { display: none !important; }
img { max-width: 100%; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { padding-block: 0 calc(var(--tabbar-h) + 40px + env(safe-area-inset-bottom, 0px)); }
body.with-install main { padding-bottom: calc(var(--tabbar-h) + 104px + env(safe-area-inset-bottom, 0px)); }
body.with-banner main { padding-bottom: calc(var(--tabbar-h) + 110px + env(safe-area-inset-bottom, 0px)); }
body.in-workout main { padding-bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: -.005em; text-wrap: balance; margin: 0; }
.eyebrow { font-size: .7rem; text-transform: uppercase; letter-spacing: .11em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 22px; height: 22px; flex: none; }
.ic.sm { width: 18px; height: 18px; }
.accent { color: var(--pink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

button, .btn { font: 600 .95rem/1 var(--f-body); border-radius: 14px; border: 1px solid var(--line); background: var(--raised); color: var(--ink); padding: 11px 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; min-height: 44px; transition: transform .12s ease, background-color .2s ease, border-color .2s ease; }
button:hover, .btn:hover { border-color: rgba(214, 120, 165, .3); }
button:active, .btn:active { transform: scale(.97); }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
.primary { background: var(--grad); border-color: transparent; color: var(--on-accent); }
.primary:hover { border-color: transparent; filter: brightness(1.06); }
.big { width: 100%; min-height: 56px; font-size: 1.05rem; border-radius: var(--r); }
.soft { background: var(--chip); color: var(--pink); border-color: transparent; }
.danger { color: var(--bad); }
.small { padding: 7px 12px; min-height: 36px; font-size: .85rem; border-radius: 12px; }
.link { border: 0; padding: 0; min-height: 44px; color: var(--pink); font-weight: 600; background: none; }
.iconbtn { width: 44px; height: 44px; padding: 0; border-radius: 13px; background: transparent; border-color: transparent; color: var(--muted); }
.iconbtn:hover { color: var(--ink); }

input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; transition: border-color .2s ease; }
input:focus, select:focus, textarea:focus { border-color: var(--pink); outline: none; }
textarea { min-height: 84px; resize: vertical; }
label.f { display: grid; gap: 6px; min-width: 0; }
label.f > span { text-transform: uppercase; letter-spacing: .1em; font-size: .68rem; color: var(--muted); font-weight: 600; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.panel + .panel, .panel + .cards, .cards + .panel { margin-top: 12px; }
.panel .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.panel .hd h2 { font-size: 1.2rem; }
.stack { display: grid; gap: 12px; }

/* Header */
.top { display: flex; align-items: center; gap: 10px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 18px; padding: 12px max(16px, env(safe-area-inset-left, 0px)); min-height: 64px; position: sticky; top: 0; z-index: 10;
  background: rgba(255, 244, 248, .85); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); border-bottom: 1px solid var(--line); }
.top .brand { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; min-width: 0; }
.top .brand img { width: 42px; height: 42px; border-radius: 11px; box-shadow: 0 0 0 1px var(--line); }
.top .brand b { display: block; font: 800 1.3rem/1 var(--f-display); letter-spacing: .01em; }
.top .brand small { display: block; font-size: .76rem; color: var(--muted); font-weight: 500; margin-top: 4px; }
.top h1 { font-size: 1.5rem; }
.top .spacer { flex: 1; }
.back { color: var(--muted); text-decoration: none; font-weight: 600; font-size: .92rem; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; }
.back:hover { color: var(--ink); }
.clock { font: 800 1.25rem/1 var(--f-display); font-variant-numeric: tabular-nums; flex: 1; text-align: center; }

/* Bottom tab bar */
.tabbar { position: fixed; z-index: 20; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  max-width: 540px; margin: 0 auto; height: var(--tabbar-h); border-radius: 26px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 0 5px; gap: 1px;
  background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); box-shadow: var(--shadow); }
.tabbar a { position: relative; display: grid; justify-items: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: .68rem; font-weight: 600; padding: 8px 0; min-height: 56px; align-content: center; transition: color .2s ease; }
.tabbar a { border-radius: 20px; min-height: 56px; }
.tabbar a[aria-current="page"] { color: var(--pink); background: rgba(240, 130, 180, .14); }

/* Workout-in-progress bar */
.livebar { position: fixed; z-index: 19; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); max-width: 560px; margin: 0 auto;
  bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 18px; width: auto;
  background: rgba(255, 255, 255, .96); border: 1px solid rgba(240, 130, 180, .4); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); animation: rise .35s ease both; text-align: left; justify-content: flex-start; }
.livebar .txt { flex: 1; min-width: 0; font-size: .82rem; color: var(--muted); }
.livebar .txt b { display: block; font-size: .95rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pulse { width: 11px; height: 11px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 0 0 rgba(240, 130, 180, .6); animation: pulse 1.6s ease-out infinite; flex: none; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(240, 130, 180, 0); } 100% { box-shadow: 0 0 0 0 rgba(240, 130, 180, 0); } }
.pill { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; background: var(--grad); color: var(--on-accent); font-weight: 700; border: 0; }

/* Install bar */
.installbar { position: fixed; z-index: 21; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); max-width: 560px; margin: 0 auto;
  bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 12px; border-radius: 18px;
  background: rgba(255, 255, 255, .96); border: 1px solid rgba(240, 130, 180, .35); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); animation: rise .35s ease both; }
.installbar img { width: 36px; height: 36px; border-radius: 9px; }
.installbar .txt { flex: 1; min-width: 0; font-size: .82rem; line-height: 1.3; color: var(--muted); }
.installbar .txt b { display: block; font-size: .92rem; color: var(--ink); }
.installbar .x { width: 36px; min-height: 36px; padding: 0; background: transparent; border: 0; color: var(--muted); font-size: 1.1rem; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.guide { display: grid; gap: 14px; padding-top: 14px; }
.guide ol { margin: 0; padding-left: 1.3em; display: grid; gap: 12px; }
.guide li { padding-left: 4px; line-height: 1.45; }
.guide .sharei { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line); vertical-align: -8px; margin: 0 2px; color: var(--pink); }
.pointer { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); bottom: calc(6px + env(safe-area-inset-bottom, 0px)); color: var(--pink); display: grid; justify-items: center; gap: 2px; font-weight: 700; font-size: .85rem; pointer-events: none; text-shadow: 0 2px 8px #000; animation: bob 1s ease-in-out infinite; }
.pointer.top { bottom: auto; top: calc(6px + env(safe-area-inset-top, 0px)); animation-name: bobup; }
.pointer.right { left: auto; right: 16px; transform: none; }
.pointer svg { width: 34px; height: 34px; }
@keyframes bob { 50% { translate: 0 8px; } }
@keyframes bobup { 50% { translate: 0 -8px; } }

/* Hero + week strip */
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 20px; background: var(--grad); color: var(--on-accent); margin-bottom: 12px; }
.hero::after { content: ""; position: absolute; width: 170px; height: 170px; right: -50px; top: -70px; border-radius: 50%; background: rgba(255, 255, 255, .16); }
.hero h2 { font-size: 1.45rem; font-weight: 800; position: relative; }
.hero p { margin: 4px 0 0; font-weight: 500; position: relative; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
.week .d { display: grid; justify-items: center; gap: 6px; font-size: .7rem; color: var(--muted); font-weight: 600; }
.week .dc { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); color: var(--muted); font: 700 .85rem/1 var(--f-body); }
.week .dc.on { background: var(--grad); color: var(--on-accent); }
.week .dc.today { box-shadow: inset 0 0 0 2px var(--pink); color: var(--pink); }

/* Tallies / tiles */
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tally div { display: grid; gap: 1px; min-width: 0; }
.tally b { font: 700 1rem/1.2 var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tally span { color: var(--muted); font-size: .75rem; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 2px; min-width: 0; }
.tile .ti { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: rgba(240, 130, 180, .14); color: var(--pink); margin-bottom: 8px; }
.tile b { font: 800 1.35rem/1.1 var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile span { color: var(--muted); font-size: .8rem; }
.tile.rec b { color: var(--pink); }

/* Cards */
.sectionhd { display: flex; justify-content: space-between; align-items: center; margin: 22px 2px 10px; gap: 10px; }
.sectionhd h2 { font-size: 1.2rem; }
.cards { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; color: inherit; text-decoration: none; cursor: pointer; transition: border-color .2s ease, transform .12s ease; text-align: left; }
.card:hover { border-color: rgba(214, 120, 165, .28); }
.card:active { transform: scale(.99); }
.card h3 { font-size: 1.1rem; line-height: 1.2; overflow-wrap: anywhere; }
.card .meta { color: var(--muted); font-size: .84rem; }
.exline { display: flex; align-items: center; gap: 10px; font-size: .92rem; min-width: 0; }
.exline .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumbic { flex: none; width: 40px; height: 40px; border-radius: 13px; background: rgba(240, 130, 180, .13); color: var(--pink); display: grid; place-items: center; }
.thumbic.sm { width: 30px; height: 30px; border-radius: 9px; }
.thumbic.sm .ic { width: 17px; height: 17px; }
.thumbic.lg { width: 56px; height: 56px; border-radius: 17px; }
.thumbic.lg .ic { width: 30px; height: 30px; }
.divider { height: 1px; background: var(--line); }
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 36px 20px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.empty h2 { font-size: 1.35rem; }
.empty p { margin: 0; max-width: 44ch; color: var(--muted); }

/* Lists & filters */
.toolbar { display: flex; gap: 10px; margin-bottom: 12px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; min-height: 36px; padding: 6px 14px; border-radius: 999px; font-size: .85rem; background: var(--chip); border-color: transparent; color: var(--muted); }
.chips button[aria-pressed="true"] { background: var(--grad); color: var(--on-accent); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; text-align: left; color: var(--ink); text-decoration: none; font-weight: 400; justify-content: flex-start; }
.li:last-child { border-bottom: 0; }
.li:active { transform: none; background: var(--raised); }
.li .t { display: block; font-weight: 600; }
.li .s { display: block; font-size: .82rem; color: var(--muted); }
.li .grow { flex: 1; min-width: 0; }
.li.sel { background: rgba(240, 130, 180, .12); }
.selnum { width: 26px; height: 26px; border-radius: 50%; background: var(--grad); color: var(--on-accent); font-weight: 800; font-size: .8rem; display: grid; place-items: center; flex: none; }
.grouphd { margin: 18px 4px 8px; }

.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 4px; border-radius: 14px; background: var(--chip); margin-bottom: 14px; }
.tabs button { border: 0; border-radius: 10px; min-height: 38px; font-size: .84rem; font-weight: 600; color: var(--muted); background: transparent; padding: 6px 2px; }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--raised); box-shadow: 0 0 0 1px var(--line); }

/* Soft shadows for the light theme */
.panel, .card, .rcard, .tile, .list, .mcard, .startcard, .duo button { box-shadow: 0 2px 12px rgba(200, 80, 138, .07); }
.switchrow input::after { box-shadow: 0 1px 4px rgba(74, 34, 56, .25); }
.top .brand img, .login .logo { box-shadow: 0 4px 14px rgba(200, 80, 138, .2); }

/* Hevy-style blocks */
.startcard { width: 100%; justify-content: flex-start; gap: 14px; min-height: 58px; font-size: 1.02rem; background: var(--surface); border-radius: 16px; }
.startcard .ic { color: var(--pink); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.duo button { justify-content: flex-start; gap: 12px; min-height: 54px; background: var(--surface); border-radius: 16px; font-size: .98rem; }
.duo button .ic { color: var(--pink); }
.folder { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 600; background: none; border: 0; padding: 0; min-height: 44px; }
.folder .ic { transition: transform .2s ease; }
.folder[aria-expanded="false"] .ic { transform: rotate(-90deg); }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.rcard .rtop { display: flex; align-items: flex-start; gap: 8px; }
.rcard .rtop a { flex: 1; min-width: 0; color: var(--ink); text-decoration: none; }
.rcard h3 { font-size: 1.12rem; }
.rcard p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.roundbtn { width: 48px; height: 48px; padding: 0; border-radius: 50%; background: var(--raised); }
.bigval { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.bigval b { font: 800 1.35rem/1 var(--f-display); }
.bigval span { color: var(--pink); font-weight: 600; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pills button { border-radius: 999px; min-height: 40px; padding: 8px 18px; background: var(--raised); border-color: transparent; }
.pills button[aria-pressed="true"] { background: var(--grad); color: var(--on-accent); }
.rtable { display: grid; margin: 6px -16px 0; }
.rtable .r { display: grid; grid-template-columns: 70px 1fr 1fr; padding: 11px 16px; font-size: 1rem; text-align: center; }
.rtable .r:nth-child(odd):not(.h) { background: rgba(214, 120, 165, .05); }
.rtable .r.h { font-size: .7rem; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.exlink { display: flex; align-items: center; gap: 14px; color: var(--pink); text-decoration: none; font: 700 1.08rem/1.25 var(--f-display); }

/* StrongHER tracker */
.shlogo { font-size: 1.6rem; font-weight: 800; letter-spacing: .01em; }
.sh-strong { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 500; letter-spacing: 0; }
.wk { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.wk::-webkit-scrollbar { display: none; }
.wk button { flex: none; min-width: 66px; display: grid; gap: 2px; padding: 7px 10px; border-radius: 12px; background: var(--chip); border-color: transparent; color: var(--muted); font-size: .8rem; }
.wk button small { font-size: .66rem; font-weight: 500; }
.wk button[aria-pressed="true"] { background: var(--grad); color: var(--on-accent); }
.pex { padding: 14px 0; border-bottom: 1px solid var(--line); }
.pex:last-child { border-bottom: 0; padding-bottom: 4px; }
.pex .nm { display: flex; gap: 8px; align-items: baseline; }
.pex .nm b { font-weight: 600; }
.pex .no { color: var(--muted); font-size: .72rem; font-weight: 700; min-width: 26px; font-variant-numeric: tabular-nums; }
.pex .note { color: var(--muted); font-size: .78rem; margin-left: 34px; }
.boxes { display: flex; gap: 8px; margin: 8px 0 0 34px; flex-wrap: wrap; }
.box { display: grid; justify-items: center; gap: 3px; width: 58px; }
.box span { font-size: .66rem; color: var(--muted); font-weight: 600; }
.box input { height: 44px; text-align: center; font-weight: 700; padding: 0 2px; }
.box input.filled { border-color: rgba(240, 130, 180, .55); background: rgba(240, 130, 180, .12); }
.prevwk { margin: 6px 0 0 34px; font-size: .76rem; color: var(--muted); }
.pgrid { overflow-x: auto; margin: 0 -18px; padding: 0 18px; -webkit-overflow-scrolling: touch; }
table.pg { border-collapse: separate; border-spacing: 0; font-size: .78rem; min-width: 760px; }
.pg th, .pg td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; vertical-align: middle; }
.pg th:first-child, .pg td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; white-space: normal; min-width: 132px; max-width: 150px; box-shadow: 1px 0 0 var(--line); }
.pg .cells { display: flex; gap: 3px; justify-content: center; }
